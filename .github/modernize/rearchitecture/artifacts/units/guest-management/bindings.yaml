    name: "GET /dashboard/events/:id/guests and guest create/edit routes"
    source_loc: src/router/index.ts:40
    target: GuestsTab and GuestsForm
    must_appear_in_target: true
    notes: "Create and edit use the same form component."
runtime_config:
