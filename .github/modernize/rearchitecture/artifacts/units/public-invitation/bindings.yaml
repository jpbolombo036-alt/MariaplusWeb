unit: public-invitation
bindings:
  - type: route-declaration
    name: "GET /invitations/:token"
    source_loc: src/router/index.ts:80
    target: PublicInvitationView
    must_appear_in_target: true
    notes: "Public token route; auth guard skips session restoration."
runtime_config:
  - key: VITE_API_BASE_URL
    source_loc: src/api/config.ts:20
    source: env
    default_value: "Production API base URL"
    must_appear_in_target: true
    notes: "Base URL for invitation, RSVP, gallery, and card requests."
